<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Student Grade Calculator with performance analysis and result history"
    >

    <title>Student Grade Calculator</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
            line-height: 1.6;
            transition: 0.3s;
        }

        header {
            background: #222;
            color: white;
            padding: 25px 15px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
        }

        header p {
            opacity: 0.85;
        }

        .container {
            width: 92%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        .form-group input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #333;
        }

        .marks-title {
            margin-top: 25px;
            margin-bottom: 15px;
        }

        .button-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            background: #222;
            color: white;
            transition: 0.2s;
        }

        button:hover {
            opacity: 0.8;
            transform: translateY(-1px);
        }

        .secondary-button {
            background: #666;
        }

        .danger-button {
            background: #444;
        }

        #studentDetails,
        #output,
        #history {
            margin-top: 20px;
        }

        .result-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .result-table th,
        .result-table td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        .result-table th {
            background: #eee;
        }
